server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite assets can be cached safely because their names are content-hashed.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React Router routes must resolve to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
