query DocumentBrowser($scope: DocumentScope!, $first: Int!, $after: String, $folderId: String, $search: String) {
  documents(scope: $scope, first: $first, after: $after, folderId: $folderId, search: $search) {
    nodes {
      id version name type owner modifiedAt size status folderId shared starred deletedAt
      permission tags { id name color }
      viewerCapabilities { canView canComment canEdit canShare canDelete }
    }
    pageInfo { hasNextPage endCursor }
  }
  folders { id name parentId count }
}
