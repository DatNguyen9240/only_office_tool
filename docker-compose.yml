services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: meridian-dms-api:latest
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "30389:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
