services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - "${MINIO_DATA_PATH:-./.data/minio}:/data"
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        test -n "$${MINIO_ROOT_USER}" || { echo "MINIO_ROOT_USER is required"; exit 1; }
        test -n "$${MINIO_ROOT_PASSWORD}" || { echo "MINIO_ROOT_PASSWORD is required"; exit 1; }
        test -n "$${S3_BUCKET}" || { echo "S3_BUCKET is required"; exit 1; }
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; do
          sleep 2
        done
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: meridian-dms-api:latest
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      S3_ENDPOINT: http://minio:9000
      MINIO_METRICS_URL: http://minio:9000
      MINIO_METRICS_TOKEN: ""
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "5000:3000"
    init: true
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
