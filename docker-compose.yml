services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "5678:9000"
      - "9621:9001"
    volumes:
      - "${MINIO_DATA_PATH:-./.data/minio}:/data"
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        test -n "$${MINIO_ROOT_USER}" || { echo "MINIO_ROOT_USER is required"; exit 1; }
        test -n "$${MINIO_ROOT_PASSWORD}" || { echo "MINIO_ROOT_PASSWORD is required"; exit 1; }
        test -n "$${S3_BUCKET}" || { echo "S3_BUCKET is required"; exit 1; }
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; do
          sleep 2
        done
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    restart: unless-stopped

  tika:
    image: apache/tika:latest-full
    ports:
      - "127.0.0.1:9998:9998"
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: meridian-dms-api:latest
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://103.190.38.46:5678}
      ONLYOFFICE_JWT_SECRET: QX3ihsr0IA7mMG4E6e7Fy3SCZ5Z6Tq
      MINIO_METRICS_URL: http://minio:9000
      MINIO_METRICS_TOKEN: ""
      REDIS_URL: redis://redis:6379
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      MALWARE_SCAN_REQUIRED: "true"
      TIKA_URL: http://tika:9998
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      clamav:
        condition: service_started
      tika:
        condition: service_started
      elasticsearch:
        condition: service_started
    ports:
      - "5000:3000"
    init: true
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  document-processor:
    build:
      context: .
      dockerfile: document-processor/Dockerfile
    image: meridian-dms-document-processor:latest
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "5001:8080"
    restart: unless-stopped

volumes:
  redis-data:
  clamav-data:
  elasticsearch-data:
