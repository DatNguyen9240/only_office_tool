# Map WebSocket Upgrade Header
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. Frontend Meet UI (meet.ten-mien-cua-toi.com)
server {
    listen 80;
    server_name meet.ten-mien-cua-toi.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. LiveKit Signaling Server (livekit.ten-mien-cua-toi.com)
server {
    listen 80;
    server_name livekit.ten-mien-cua-toi.com;

    location / {
        proxy_pass http://127.0.0.1:30389;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# 3. Backend Token API (api-meet.ten-mien-cua-toi.com)
server {
    listen 80;
    server_name api-meet.ten-mien-cua-toi.com;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
